    <script>
    (function () {
        // 开屏动画：只在大退后首次打开时播放
        (function dismissSplash() {
            var splash = document.getElementById('splashScreen');
            if (!splash) return;

            // sessionStorage 在关闭所有标签页后自动清除
            // 如果已经播放过，直接隐藏不播动画
            try {
                if (sessionStorage.getItem('catpeas_splash_shown')) {
                    splash.classList.add('hidden');
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                    return;
                }
            } catch (e) {}

            // 标记为已播放
            try { sessionStorage.setItem('catpeas_splash_shown', '1'); } catch (e) {}

            var minTime = 1800;
            function tryDismiss() {
                splash.classList.add('fade-out');
                setTimeout(function () {
                    splash.classList.add('hidden');
                    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
                }, 600);
            }
            if (document.readyState === 'complete') {
                setTimeout(tryDismiss, minTime);
            } else {
                var start = Date.now();
                window.addEventListener('load', function () {
                    var elapsed = Date.now() - start;
                    setTimeout(tryDismiss, Math.max(0, minTime - elapsed));
                });
                setTimeout(tryDismiss, 3000);
            }
        })();

        // 主题加载
        try {
            var theme = localStorage.getItem('catpeas_theme');
            if (theme && theme !== 'default' && theme !== 'custom') {
                document.documentElement.setAttribute('data-theme', theme);
            } else if (theme === 'custom') {
                var data = JSON.parse(localStorage.getItem('catpeas_custom_theme') || '{}');
                if (data.primary) {
                    var r = document.documentElement;
                    r.style.setProperty('--pink', data.primary);
                    r.style.setProperty('--iris', data.secondary);
                    r.style.setProperty('--bg', data.bg);
                    var bl = hexToRgb(data.bg);
                    var isDark = (bl.r + bl.g + bl.b) / 3 < 128;
                    r.style.setProperty('--bg-panel', data.bg + 'f8');
                    r.style.setProperty('--bg-card', isDark ? lighten(data.bg, 15) : '#ffffff');
                    r.style.setProperty('--text', isDark ? '#d8dee9' : '#3e3640');
                    r.style.setProperty('--text-secondary', isDark ? '#b0b8c8' : '#6e6472');
                    r.style.setProperty('--text-muted', isDark ? '#7a8498' : '#a69caa');
                    r.style.setProperty('--border', isDark ? lighten(data.bg, 30) : darken(data.bg, 20));
                    r.style.setProperty('--border-light', isDark ? lighten(data.bg, 18) : darken(data.bg, 10));
                    r.style.setProperty('--pink-light', lighten(data.primary, 40));
                    r.style.setProperty('--pink-lighter', isDark ? darken(data.primary, 100) : lighten(data.primary, 70));
                    r.style.setProperty('--pink-dark', darken(data.primary, 30));
                    r.style.setProperty('--iris-light', lighten(data.secondary, 40));
                    r.style.setProperty('--iris-lighter', isDark ? darken(data.secondary, 100) : lighten(data.secondary, 70));
                    r.style.setProperty('--iris-dark', isDark ? lighten(data.secondary, 30) : darken(data.secondary, 30));
                }
            }
        } catch (e) {}

        function hexToRgb(hex) {
            return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
        }
        function lighten(hex, amt) {
            var c = hexToRgb(hex);
            return 'rgb(' + Math.min(255,c.r+amt) + ',' + Math.min(255,c.g+amt) + ',' + Math.min(255,c.b+amt) + ')';
        }
        function darken(hex, amt) {
            var c = hexToRgb(hex);
            return 'rgb(' + Math.max(0,c.r-amt) + ',' + Math.max(0,c.g-amt) + ',' + Math.max(0,c.b-amt) + ')';
        }

        // 加载自定义CSS
        try {
            var css = localStorage.getItem('catpeas_custom_css');
            if (css) {
                var style = document.createElement('style');
                style.id = 'catpeas-custom-style';
                style.textContent = css;
                document.head.appendChild(style);
            }
        } catch (e) {}
    })();
    </script>
</body>
</html>
