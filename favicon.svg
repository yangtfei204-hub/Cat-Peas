<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f8e8ea"/>
      <stop offset="60%" stop-color="#e8b4c0"/>
      <stop offset="100%" stop-color="#c898a8"/>
    </radialGradient>
    <radialGradient id="face" cx="48%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5f0"/>
      <stop offset="50%" stop-color="#f5ddd5"/>
      <stop offset="100%" stop-color="#e8c4b8"/>
    </radialGradient>
    <radialGradient id="earL" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0c8c0"/>
      <stop offset="100%" stop-color="#d4979c"/>
    </radialGradient>
    <radialGradient id="earR" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0c8c0"/>
      <stop offset="100%" stop-color="#d4979c"/>
    </radialGradient>
    <radialGradient id="earInL" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f8b8b8"/>
      <stop offset="100%" stop-color="#e8909a"/>
    </radialGradient>
    <radialGradient id="earInR" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f8b8b8"/>
      <stop offset="100%" stop-color="#e8909a"/>
    </radialGradient>
    <radialGradient id="cheekL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8a0a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f8a0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheekR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8a0a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f8a0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nose" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d4888e"/>
      <stop offset="100%" stop-color="#b06870"/>
    </radialGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0d0e0" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c08090" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#d4a0aa" stroke-width="3" opacity="0.4"/>
  
  <!-- 装饰小圆点 -->
  <circle cx="80" cy="120" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="432" cy="100" r="6" fill="#fff" opacity="0.4"/>
  <circle cx="60" cy="380" r="5" fill="#fff" opacity="0.35"/>
  <circle cx="440" cy="360" r="7" fill="#fff" opacity="0.45"/>
  <circle cx="120" cy="430" r="4" fill="#e8c0d0" opacity="0.5"/>
  <circle cx="400" cy="430" r="5" fill="#e8c0d0" opacity="0.4"/>
  
  <!-- 猫咪主体（带柔和阴影） -->
  <g filter="url(#softShadow)">
    <!-- 左耳 -->
    <path d="M148 220 Q130 130 165 95 Q175 85 185 95 L200 140 Q195 180 175 210 Z" fill="url(#earL)"/>
    <path d="M160 205 Q150 145 175 115 Q180 108 186 115 L195 148 Q192 178 178 200 Z" fill="url(#earInL)"/>
    
    <!-- 右耳 -->
    <path d="M364 220 Q382 130 347 95 Q337 85 327 95 L312 140 Q317 180 337 210 Z" fill="url(#earR)"/>
    <path d="M352 205 Q362 145 337 115 Q332 108 326 115 L317 148 Q320 178 334 200 Z" fill="url(#earInR)"/>
    
    <!-- 头部 -->
    <ellipse cx="256" cy="290" rx="130" ry="120" fill="url(#face)"/>
    
    <!-- 额头花纹（M形） -->
    <path d="M210 240 Q220 225 235 235 Q256 215 277 235 Q292 225 302 240" stroke="#e0b8a8" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round"/>
  </g>
  
  <!-- 左眼 -->
  <ellipse cx="215" cy="290" rx="22" ry="24" fill="#3a3040"/>
  <ellipse cx="215" cy="292" rx="18" ry="20" fill="#4a4050"/>
  <circle cx="208" cy="283" r="7" fill="#fff" opacity="0.85"/>
  <circle cx="222" cy="296" r="3.5" fill="#fff" opacity="0.5"/>
  
  <!-- 右眼 -->
  <ellipse cx="297" cy="290" rx="22" ry="24" fill="#3a3040"/>
  <ellipse cx="297" cy="292" rx="18" ry="20" fill="#4a4050"/>
  <circle cx="290" cy="283" r="7" fill="#fff" opacity="0.85"/>
  <circle cx="304" cy="296" r="3.5" fill="#fff" opacity="0.5"/>
  
  <!-- 鼻子 -->
  <ellipse cx="256" cy="325" rx="10" ry="7.5" fill="url(#nose)"/>
  <ellipse cx="254" cy="323" rx="3" ry="2" fill="#fff" opacity="0.4"/>
  
  <!-- 嘴巴 -->
  <path d="M244 332 Q256 345 268 332" stroke="#c07880" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M256 325 L256 335" stroke="#c07880" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 腮红 -->
  <ellipse cx="185" cy="318" rx="22" ry="16" fill="url(#cheekL)"/>
  <ellipse cx="327" cy="318" rx="22" ry="16" fill="url(#cheekR)"/>
  
  <!-- 左胡须 -->
  <line x1="160" y1="305" x2="108" y2="295" stroke="#d4a8a8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="158" y1="320" x2="105" y2="325" stroke="#d4a8a8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="162" y1="335" x2="112" y2="350" stroke="#d4a8a8" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  
  <!-- 右胡须 -->
  <line x1="352" y1="305" x2="404" y2="295" stroke="#d4a8a8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="354" y1="320" x2="407" y2="325" stroke="#d4a8a8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="350" y1="335" x2="400" y2="350" stroke="#d4a8a8" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  
  <!-- 小爪子（下方伸出） -->
  <g opacity="0.9">
    <!-- 左爪 -->
    <path d="M195 385 Q190 410 200 420 Q210 428 218 418 Q222 410 218 395" fill="#f0d0c8" stroke="#e0b8b0" stroke-width="1.5"/>
    <circle cx="198" cy="418" r="5" fill="#f0b8b0" opacity="0.6"/>
    <circle cx="210" cy="422" r="4.5" fill="#f0b8b0" opacity="0.6"/>
    <circle cx="204" cy="412" r="6" fill="#f0b0a8" opacity="0.5"/>
    
    <!-- 右爪 -->
    <path d="M317 385 Q322 410 312 420 Q302 428 294 418 Q290 410 294 395" fill="#f0d0c8" stroke="#e0b8b0" stroke-width="1.5"/>
    <circle cx="314" cy="418" r="5" fill="#f0b8b0" opacity="0.6"/>
    <circle cx="302" cy="422" r="4.5" fill="#f0b8b0" opacity="0.6"/>
    <circle cx="308" cy="412" r="6" fill="#f0b0a8" opacity="0.5"/>
  </g>
  
  <!-- 拼豆元素：头顶小豆子 -->
  <g filter="url(#glow)">
    <circle cx="220" cy="178" r="11" fill="#FFB7E7" stroke="#f0a0d0" stroke-width="1.5"/>
    <circle cx="218" cy="175" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="220" cy="178" r="2.5" fill="#e890c0" opacity="0.3"/>
    
    <circle cx="256" cy="165" r="13" fill="#A0E2FB" stroke="#80c8e8" stroke-width="1.5"/>
    <circle cx="253" cy="162" r="3.5" fill="#fff" opacity="0.6"/>
    <circle cx="256" cy="165" r="3" fill="#78b8d8" opacity="0.3"/>
    
    <circle cx="292" cy="178" r="11" fill="#CAEB7B" stroke="#a8d060" stroke-width="1.5"/>
    <circle cx="290" cy="175" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="292" cy="178" r="2.5" fill="#90c050" opacity="0.3"/>
  </g>
  
  <!-- 闪光装饰 -->
  <g opacity="0.7">
    <!-- 星星1 -->
    <path d="M390 180 L393 190 L403 193 L393 196 L390 206 L387 196 L377 193 L387 190 Z" fill="url(#sparkle)"/>
    <!-- 星星2 -->
    <path d="M130 170 L132 177 L139 179 L132 181 L130 188 L128 181 L121 179 L128 177 Z" fill="url(#sparkle)"/>
    <!-- 星星3 -->
    <path d="M370 280 L372 285 L377 287 L372 289 L370 294 L368 289 L363 287 L368 285 Z" fill="url(#sparkle)" opacity="0.5"/>
  </g>
</svg>
